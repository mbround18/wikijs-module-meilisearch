name: Build and Release WASM

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Rustfmt Check
        uses: actions-rust-lang/rustfmt@v1

      - name: Clippy Check
        run: cargo clippy --target wasm32-unknown-unknown -- -D warnings

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup System
        run: |
          sudo apt-get update && sudo apt-get install --no-install-recommends -y cmake pkg-config libssl-dev zip
          make setup
          make build

      - name: Create ZIP file
        run: |
          cd pkg && zip -r ../meilisearch.zip ./*

      # paws computes the next version from the last `vX.Y.Z` tag + PR
      # labels/branch inference (see mbround18/paws) instead of a
      # hand-maintained VERSION file — the file drifting out of sync with
      # the tags is what silently stopped releases from firing.
      - name: Install paws
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: mbround18/paws/actions/paws-up@main
        with:
          install-dagger: "false"

      - name: Tag and publish release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: release
        run: |
          VERSION=$(paws semver --push)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          gh release upload "$VERSION" meilisearch.zip --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
