name: Build and Release Module

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  rust-builder:
    name: Rust builder (wasm + binary)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Rustfmt Check
        uses: actions-rust-lang/rustfmt@v1

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y cmake pkg-config libssl-dev

      - name: Build wasm + binary
        run: |
          rustup target add wasm32-unknown-unknown
          wasm-pack build --release --target nodejs --out-dir pkg
          cargo build --release --locked --bin wiki_meilisearch

      - name: Upload Rust artifacts (pkg)
        uses: actions/upload-artifact@v4
        with:
          name: pkg
          path: pkg

      - name: Upload Rust artifacts (target-release)
        uses: actions/upload-artifact@v4
        with:
          name: target-release
          path: target/release

  node-builder:
    name: Node builder (bundle dist)
    runs-on: ubuntu-latest
    needs: rust-builder
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js with pnpm
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Rust artifacts (pkg)
        uses: actions/download-artifact@v4
        with:
          name: pkg
          path: pkg

      - name: Build dist (rspack)
        env:
          VERSION: ${{ github.sha }}
        run: |
          pnpm run build:wasm
          mkdir -p dist/pkg
          cp -r pkg/* ./dist/pkg/
          cp ./engine.js ./dist/engine.js
          cp ./definition.yml ./dist/definition.yml
          cp ./LICENSE ./dist/LICENSE

      - name: Zip dist folder
        run: |
          cd dist
          zip -r ../meilisearch.zip ./*

      - name: Upload dist zip
        uses: actions/upload-artifact@v4
        with:
          name: module-dist
          path: meilisearch.zip

  release:
    name: Create Release with dist
    runs-on: ubuntu-latest
    needs: node-builder
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: module-dist
          path: .

      - name: Read VERSION
        id: read_version
        run: |
          if [ -f dist/VERSION ]; then
            echo "version=$(cat dist/VERSION | tr -d '\n')" >> $GITHUB_OUTPUT
          elif [ -f VERSION ]; then
            echo "version=$(cat VERSION | tr -d '\n')" >> $GITHUB_OUTPUT
          else
            echo "version=dev" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        run: |
          TAG="v${{ steps.read_version.outputs.version }}"
          echo "Creating Release $TAG"
          gh release create "$TAG" meilisearch.zip --title "$TAG" --notes "Wiki.js Meilisearch module bundle"
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
