key: meilisearch
title: Meilisearch Engine
author: mbround18
isAvailable: true
logo: https://cdn.jsdelivr.net/gh/mbround18/wikijs-module-meilisearch/docs/assets/logo.png
website: https://github.com/mbround18/wikijs-module-meilisearch
props:
  meilisearchHost:
    title: "Meilisearch: Host"
    type: String
    hint: "The URL or IP address where the Meilisearch server is hosted."
    default: "http://meilisearch:7700"
  meilisearchApiKey:
    type: String
    title: "Meilisearch: API Key || Master Key"
    hint: |
      The master key is required to create and manage indexes and API keys in Meilisearch.
      You may use an API key instead, but the required index must already exist and the API key must have permissions for that index.
      For production, it is recommended to use a restricted API key with a policy that grants access only to the necessary actions and the configured index.
      Learn more about Meilisearch key policies and security best practices: <a href="https://www.meilisearch.com/docs/reference/api/keys" target="_blank">https://www.meilisearch.com/docs/reference/api/keys</a>
    placeholder: "Enter your Meilisearch master key"
    default: "demo"
  indexName:
    title: "Meilisearch: Index Name"
    type: String
    hint: "The name for the Meilisearch index. All documents will be stored in this single index."
    default: "wiki_index"
  timeout:
    title: "Meilisearch: Timeout (ms)"
    type: Number
    hint: "Timeout for search requests in meiliseconds."
    default: 5000
