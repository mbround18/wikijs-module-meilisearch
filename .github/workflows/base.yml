name: Build and Release WASM

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install paws
        uses: mbround18/paws/actions/paws-up@main

      # Runs fmt/clippy(-D warnings)/build against wasm32-unknown-unknown
      # inside an ephemeral Dagger container — paws-rust auto-detects the
      # wasm-bindgen/cdylib shape from Cargo.toml. This replaces the old
      # actions-rust-lang/setup-rust-toolchain + rustfmt + clippy + 3x
      # actions/cache steps; it's a separate, disposable environment from
      # the actual pkg/ build below, so it doesn't leave a rust toolchain
      # on the runner — that's still needed for `make build`'s wasm-pack
      # step, which paws doesn't do (it only lints/builds, no packaging).
      - name: paws ci
        run: paws ci --toolchain rust

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup System
        run: |
          sudo apt-get update && sudo apt-get install --no-install-recommends -y cmake pkg-config libssl-dev zip
          make setup
          make build

      - name: Create ZIP file
        run: |
          cd pkg && zip -r ../meilisearch.zip ./*

      # paws computes the next version from the last `vX.Y.Z` tag + PR
      # labels/branch inference (see mbround18/paws) instead of a
      # hand-maintained VERSION file — the file drifting out of sync with
      # the tags is what silently stopped releases from firing.
      - name: Tag and publish release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: release
        run: |
          VERSION=$(paws semver --push)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          gh release upload "$VERSION" meilisearch.zip --clobber
        env:
          # The job-level `contents: write` permission scopes this token —
          # no custom PAT needed. The previous `secrets.GH_TOKEN` PAT was
          # failing GitHub's GraphQL API ("unexpected GraphQL response
          # shape fetching tags"), most likely expired/under-scoped; the
          # same query succeeds against this repo with a normal token.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
